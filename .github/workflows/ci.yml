name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run full test suite
        run: python -m pytest tests/ -v

      - name: Verify all eight compliance demos execute
        run: |
          python -m node5_runtime demo
          python -m lineage demo
          python -m agent_orchestration demo
          python -m identity demo
          python -m governance demo
          python -m ai_discovery demo
          python -m supply_chain demo
          python -m digital_legacy demo
