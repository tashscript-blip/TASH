[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tash"
version = "4.2.0"
description = "Tactical Artificial System Hierarchy — Self-writing, infinite-scaling Pyramid Mathematics."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "LEGACY GROVE CODEX LLC | tashscript-blip" }
]
keywords = ["ai", "simulation", "pyramid-mathematics", "quantum", "philosophy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "flask>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/tashscript-blip/TASH"
Repository = "https://github.com/tashscript-blip/TASH"

[project.scripts]
tash = "tash_cli:main"

[tool.setuptools]
packages = ["seeker_bridge", "unity_games", "node5_runtime", "lineage", "agent_orchestration", "identity", "governance", "ai_discovery", "supply_chain", "digital_legacy", "aci_dashboard"]
py-modules = ["emergeos", "tash_cli", "journal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
